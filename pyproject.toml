[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "rec"
description = "Robot Execution Catalog (REC) is a python library to manage data from robot runs"
dynamic = ["version"]
dependencies = [
    "rdflib>=7.6.0",
    "rdf-utils @ git+https://github.com/minhnh/rdf-utils@main",
]
requires-python = ">= 3.12"
readme = "README.md"
maintainers = [
  {name = "SECORO Group", email = "secoro@groups.uni-bremen.de"}
]

[project.optional-dependencies]
mariadb = ["dotenv", "mariadb"]
dev = ["pytest", "pyshacl"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rec"]
