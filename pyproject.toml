[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rec"
version = "0.1.0"
description = "Robot Execution Catalog (REC) is a python library to manage data from robot runs"
dependencies = [
    "rdflib"
]
requires-python = ">= 3.11"
readme = "README.md"
maintainers = [
  {name = "SECORO Group", email = "secoro@groups.uni-bremen.de"}
]

[project.optional-dependencies]
dev = ["pytest", "pyshacl"]
mariadb = ["mariadb", "python-dotenv"]
docs = ["sphinx", "furo"]

[tool.setuptools.packages.find]
where = ["."]
